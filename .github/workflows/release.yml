name: Release

# Push a tag like v0.2.0 (or v0.2.0-beta.1) to build, test and publish all packages.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (without the leading v)'
        required: true

permissions:
  contents: write
  packages: write
  id-token: write   # OIDC token for nuget.org Trusted Publishing

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x
      - name: Resolve version
        id: v
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then v="${{ github.event.inputs.version }}"; else v="${GITHUB_REF_NAME#v}"; fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - name: Test
        run: ./build.sh test
      - name: Pack
        run: ./build.sh pack "${{ steps.v.outputs.version }}"
      - name: Push to GitHub Packages
        run: dotnet nuget push "artifacts/*.nupkg" --source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json" --api-key "${{ secrets.GITHUB_TOKEN }}" --skip-duplicate
      # nuget.org via Trusted Publishing: no stored API key. GitHub issues an OIDC token, nuget.org checks it against
      # the trusted publishing policy (owner Blixter, repo tempus, workflow release.yml) and returns a key valid for 1 hour.
      # Skipped until the repository variable NUGET_USER (your nuget.org profile name) is set.
      - name: NuGet login (OIDC to temporary API key)
        if: vars.NUGET_USER != ''
        id: nuget
        uses: NuGet/login@v1
        with:
          user: ${{ vars.NUGET_USER }}
      - name: Push to nuget.org
        if: vars.NUGET_USER != ''
        run: dotnet nuget push "artifacts/*.nupkg" --source https://api.nuget.org/v3/index.json --api-key "${{ steps.nuget.outputs.NUGET_API_KEY }}" --skip-duplicate
      - name: GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.v.outputs.version }}
          generate_release_notes: true
          files: artifacts/*
